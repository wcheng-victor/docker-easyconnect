# 公网域名回退解析（配合 start.sh 的 open_vpn_dns 使用）。
#
# 背景：宿主机 mihomo TUN 会劫持所有明文 53 端口的 DNS 查询并返回 fake-IP，
# 公司内网 DNS 又不对公网域名做递归（SERVFAIL）。本实例用 DoT（TCP 853）加密
# 上游绕开劫持，为容器提供公网域名的真实解析。
#
# 用法：监听 127.0.0.2:53，作为 resolv.conf 中公司 DNS 之后的回退 nameserver。
# glibc 在前一个 nameserver 返回 SERVFAIL/REFUSED 时会尝试下一个，因此：
#   内网域名（公司 DNS 可答）→ 真实内网 IP，走 VPN 隧道；
#   公网域名（公司 DNS SERVFAIL）→ 本实例 DoT → 真实公网 IP，走默认路由直连。
server:
	interface: 127.0.0.2
	port: 53
	verbosity: 1
	use-syslog: no
	logfile: ""
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	module-config: "iterator"
	chroot: ""
	username: ""
	directory: ""
	pidfile: "/run/unbound-outer.pid"
	hide-identity: yes
	hide-version: yes
	tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
	name: "."
	forward-tls-upstream: yes
	forward-addr: 223.5.5.5@853#dns.alidns.com
	forward-addr: 119.29.29.29@853#dot.pub
